    <style>
:root {
  --ink: #152a35;
  --muted: #70808a;
  --faint: #a4afb5;
  --line: #e6ebe9;
  --panel: #ffffff;
  --canvas: #f6f8f6;
  --mint: #1b8c72;
  --mint-deep: #116c59;
  --mint-pale: #e8f4ef;
  --lime: #dff176;
  --coral: #f08068;
  --coral-pale: #fff0ed;
  --blue: #5b7fc9;
  --blue-pale: #edf2fb;
  --violet: #8772bb;
  --yellow: #e9b951;
  --shadow: 0 8px 28px rgba(27, 55, 47, .055);
  --radius: 18px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: "DM Sans", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; }
button { color: inherit; }
svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: 20; width: 232px;
  display: flex; flex-direction: column; padding: 28px 18px 20px;
  background: #102f2b; color: #eaf5f1;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 34px; text-decoration: none; color: inherit; }
.brand-mark { width: 35px; height: 35px; display: grid; place-items: center; color: var(--lime); }
.brand-mark svg { width: 33px; stroke: none; fill: currentColor; }
.brand b { display: block; white-space: nowrap; font-size: 13px; letter-spacing: .02em; }
.brand small { display: block; margin-top: 3px; color: #7ea09a; font-size: 8px; letter-spacing: .17em; }
.primary-nav { flex: 1; }
.nav-label { margin: 0 12px 9px; color: #70918b; font-size: 10px; font-weight: 600; letter-spacing: .16em; }
.nav-label-spaced { margin-top: 26px; }
.nav-item {
  width: 100%; min-height: 44px; display: flex; align-items: center; gap: 12px;
  margin: 3px 0; padding: 8px 13px; border: 0; border-radius: 10px;
  color: #9fbbb5; background: transparent; cursor: pointer; text-align: left; font-size: 13px;
  transition: .2s ease;
}
.nav-item:hover { color: #fff; background: rgba(255,255,255,.055); }
.nav-item.active { color: #12352d; background: var(--lime); font-weight: 600; box-shadow: 0 7px 20px rgba(4,20,17,.18); }
.nav-item.parent-active { color: var(--lime); background: rgba(223,241,118,.08); font-weight: 600; }
.nav-item svg { flex: 0 0 auto; width: 17px; height: 17px; }
.nav-item > span { line-height: 1.4; }
.nav-index { display: grid; place-items: center; width: 20px; height: 20px; border: 1px solid currentColor; border-radius: 6px; font-size: 9px; font-weight: 700; }
.nav-subgroup { position: relative; margin: 5px 0 0 21px; padding: 8px 0 4px 12px; border-left: 1px solid rgba(223,241,118,.25); }.nav-subgroup > span { display: block; margin: 0 0 5px 8px; color: #6f968e; font-size: 8px; letter-spacing: .08em; }.nav-item.nav-subitem { min-height: 32px; margin: 1px 0; padding: 0 8px; border-radius: 7px; font-size: 10px; }.nav-subitem i { width: 17px; height: 17px; display: grid; place-items: center; border-radius: 5px; color: #789b94; background: rgba(255,255,255,.06); font-size: 7px; font-style: normal; }.nav-subitem.active i { color: var(--mint-deep); background: rgba(255,255,255,.48); }
.sidebar-foot { padding: 14px 4px 0; border-top: 1px solid rgba(255,255,255,.08); }
.sync-status { display: flex; align-items: center; gap: 9px; margin: 0 7px 18px; font-size: 11px; color: #abc2bd; }
.sync-status i { width: 7px; height: 7px; border-radius: 50%; background: #84d4a6; box-shadow: 0 0 0 4px rgba(132,212,166,.1); }
.sync-status small { display: block; color: #668a83; margin-top: 2px; }
.user-chip { display: grid; grid-template-columns: 35px 1fr auto; align-items: center; gap: 9px; }
.user-chip > span { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 50%; background: #285047; font-size: 11px; font-weight: 700; color: var(--lime); }
.user-chip b, .user-chip small { display: block; }
.user-chip b { font-size: 11px; }.user-chip small { margin-top: 2px; color: #668a83; font-size: 9px; }
.user-chip button { border: 0; background: none; color: #73938d; cursor: pointer; }

.main { grid-column: 2; min-width: 0; }
.topbar {
  height: 103px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 0 clamp(24px, 3.2vw, 48px); border-bottom: 1px solid var(--line); background: rgba(246,248,246,.93);
  position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
}
.eyebrow { margin: 0 0 5px; color: var(--mint); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
h1 { margin: 0; font-size: 23px; letter-spacing: -.035em; line-height: 1.15; }
.top-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
.select-wrap { height: 43px; display: flex; align-items: center; gap: 7px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; background: white; }
.select-wrap span { color: var(--faint); font-size: 10px; }
.select-wrap select, .select-wrap input { max-width: 170px; border: 0; outline: 0; color: var(--ink); background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.select-wrap.package-filter select { max-width: 145px; }
.select-wrap input[type="date"] { width: 116px; }
.icon-button, .mobile-menu { width: 43px; height: 43px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: white; cursor: pointer; transition: .2s; }
.icon-button:hover { color: white; border-color: var(--mint); background: var(--mint); }
.icon-button svg, .mobile-menu svg { width: 18px; height: 18px; }
.mobile-menu { display: none; }
.content { padding: 32px clamp(24px, 3.2vw, 48px) 52px; max-width: 1600px; margin: auto; }

.intro-row { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 24px; }
.intro-row h2 { margin: 0 0 8px; font-size: 19px; letter-spacing: -.025em; }
.intro-row p { max-width: 650px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
.data-note { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 8px; background: #eef1ef; color: var(--muted); font-size: 10px; }
.data-note i { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); }

.scheme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.scheme-card {
  position: relative; overflow: hidden; min-height: 184px; display: flex; flex-direction: column;
  padding: 21px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow);
  cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
}
.scheme-card::after { content: ""; position: absolute; right: -32px; bottom: -47px; width: 125px; height: 125px; border-radius: 50%; background: var(--scheme-pale); }
.scheme-card:hover { transform: translateY(-3px); border-color: var(--scheme-color); box-shadow: 0 14px 34px rgba(27,55,47,.09); }
.scheme-top { display: flex; align-items: center; justify-content: space-between; }
.scheme-number { width: 33px; height: 33px; display: grid; place-items: center; border-radius: 10px; color: var(--scheme-color); background: var(--scheme-pale); font-size: 10px; font-weight: 700; }
.scheme-arrow { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); }
.scheme-arrow svg { width: 14px; }
.scheme-card h3 { margin: 19px 0 7px; font-size: 16px; }
.scheme-card p { position: relative; z-index: 1; max-width: 86%; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
.scheme-card footer { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; margin-top: auto; padding-top: 15px; color: var(--scheme-color); font-size: 10px; font-weight: 600; }
.scheme-card footer i { width: 22px; height: 1px; background: currentColor; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi-card { padding: 18px 19px; border: 1px solid var(--line); border-radius: 15px; background: white; box-shadow: var(--shadow); }
.kpi-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
.kpi-head span { color: var(--muted); font-size: 11px; }
.kpi-head i { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--mint-pale); color: var(--mint); font-style: normal; font-size: 12px; }
.kpi-value { display: flex; align-items: baseline; gap: 9px; }
.kpi-value strong { font-size: 25px; letter-spacing: -.04em; }
.trend { font-size: 9px; font-weight: 600; color: var(--mint); }
.trend.down { color: var(--coral); }
.kpi-card small { display: block; margin-top: 5px; color: var(--faint); font-size: 9px; }

.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .75fr); gap: 18px; }
.panel { overflow: hidden; padding: 21px; border: 1px solid var(--line); border-radius: var(--radius); background: white; box-shadow: var(--shadow); }
.panel-wide { grid-column: 1 / -1; }
.panel-header { display: flex; align-items: start; justify-content: space-between; gap: 15px; margin-bottom: 19px; }
.panel-header h3 { margin: 0 0 4px; font-size: 14px; }
.panel-header p { margin: 0; color: var(--faint); font-size: 9px; }
.panel-tag { flex: none; padding: 5px 8px; border-radius: 6px; background: var(--mint-pale); color: var(--mint); font-size: 9px; font-weight: 600; }
.panel-actions { display: flex; gap: 5px; }
.mini-tab { padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 9px; cursor: pointer; }
.mini-tab.active { color: var(--mint-deep); background: var(--mint-pale); font-weight: 600; }

.funnel { display: flex; align-items: stretch; min-height: 151px; }
.funnel-step { flex: 1; position: relative; padding: 20px 15px 13px; text-align: center; }
.funnel-step:not(:last-child)::after { content: ""; position: absolute; top: 33px; right: -5px; z-index: 2; width: 10px; height: 10px; border-top: 1px solid #cbd6d2; border-right: 1px solid #cbd6d2; transform: rotate(45deg); }
.funnel-icon { width: 38px; height: 38px; margin: 0 auto 11px; display: grid; place-items: center; border-radius: 12px; background: var(--stage-pale); color: var(--stage-color); }
.funnel-icon svg { width: 18px; height: 18px; }
.funnel-step b { display: block; font-size: 18px; }.funnel-step span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
.funnel-step small { display: inline-block; margin-top: 9px; padding: 3px 7px; border-radius: 20px; background: #f3f5f4; color: var(--faint); font-size: 8px; }

.insight-box { margin-top: 12px; display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 10px; background: #f8faf8; color: var(--muted); font-size: 10px; line-height: 1.5; }
.insight-box .bulb { flex: none; width: 25px; height: 25px; display: grid; place-items: center; border-radius: 7px; background: #fff3ce; color: #b48825; }
.insight-box svg { width: 13px; }
.insight-box b { color: var(--ink); }

.rank-list { display: grid; gap: 14px; }
.rank-row { display: grid; grid-template-columns: minmax(80px, 1fr) 1.5fr 38px; align-items: center; gap: 11px; font-size: 10px; }
.rank-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 6px; border-radius: 6px; background: #edf1ef; overflow: hidden; }
.bar-fill { height: 100%; border-radius: inherit; background: var(--bar-color, var(--mint)); transform-origin: left; animation: grow .8s ease both; }
.rank-value { text-align: right; color: var(--muted); font-size: 9px; }
@keyframes grow { from { transform: scaleX(0); } }

.section-head { display: flex; align-items: end; justify-content: space-between; margin: 0 0 22px; }
.section-head h2 { margin: 0 0 5px; font-size: 19px; }.section-head p { margin: 0; color: var(--muted); font-size: 11px; }
.back-button { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; padding: 0; border: 0; background: none; color: var(--mint); font-size: 10px; cursor: pointer; }
.back-button svg { width: 12px; }
.goal-pill { padding: 8px 11px; border-radius: 8px; background: var(--mint-pale); color: var(--mint-deep); font-size: 10px; font-weight: 600; }

.flow-track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin: 11px 0 23px; padding: 4px 0; }
.flow-node { position: relative; text-align: center; }
.flow-node:not(:last-child)::after { content: ""; position: absolute; top: 20px; left: 65%; width: 70%; height: 1px; background: #dce4e0; }
.flow-node i { position: relative; z-index: 2; width: 40px; height: 40px; margin: auto; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--node-color); box-shadow: 0 0 0 6px var(--node-pale); font-style: normal; font-size: 11px; font-weight: 700; }
.flow-node b { display: block; margin-top: 12px; font-size: 10px; }.flow-node small { color: var(--faint); font-size: 8px; }

.line-chart { height: 190px; display: grid; grid-template-columns: 27px 1fr; grid-template-rows: 1fr 21px; }
.y-axis { display: flex; flex-direction: column; justify-content: space-between; color: var(--faint); font-size: 8px; padding-bottom: 3px; }
.plot { position: relative; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(25% - 1px), #edf1ef 25%); }
.plot svg { width: 100%; height: 100%; overflow: visible; }
.plot .area { stroke: none; fill: url(#areaGradient); }
.plot .chart-line { fill: none; stroke: var(--mint); stroke-width: 2.3; vector-effect: non-scaling-stroke; }
.plot .dot { fill: white; stroke: var(--mint); stroke-width: 2; }
.x-axis { grid-column: 2; display: flex; justify-content: space-between; padding-top: 7px; color: var(--faint); font-size: 8px; }

.stage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
.stage-card { padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: #fbfcfb; }
.stage-title { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; }
.stage-title i { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; background: var(--stage-pale); color: var(--stage-color); font-style: normal; font-size: 10px; font-weight: 700; }
.stage-title b { font-size: 11px; }.stage-title small { display: block; color: var(--faint); font-size: 8px; margin-top: 1px; }
.stage-metric { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 9px; color: var(--muted); }
.stage-metric strong { color: var(--ink); font-size: 10px; }

.heatmap-wrap { overflow-x: auto; }
.heatmap { min-width: 580px; display: grid; grid-template-columns: 66px repeat(7, 1fr); gap: 5px; }
.heatmap > span { display: grid; place-items: center; min-height: 26px; border-radius: 5px; color: var(--muted); font-size: 8px; }
.heat-cell { background: rgba(27,140,114,var(--intensity)); color: var(--intensity-text, white) !important; cursor: default; transition: transform .15s; }
.heat-cell:hover { transform: scale(1.08); }
.heat-legend { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 10px; color: var(--faint); font-size: 8px; }
.heat-legend i { width: 12px; height: 7px; border-radius: 2px; background: rgba(27,140,114,var(--i)); }

.issue-list { display: grid; gap: 10px; }
.issue { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 11px; padding: 11px; border-radius: 11px; background: #f9faf9; }
.issue-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: var(--issue-pale); color: var(--issue-color); }
.issue-icon svg { width: 16px; }.issue b { display: block; font-size: 10px; }.issue small { color: var(--faint); font-size: 8px; }
.severity { padding: 4px 7px; border-radius: 5px; font-size: 8px; font-weight: 600; }.severity.high { color: #b6503d; background: var(--coral-pale); }.severity.mid { color: #997317; background: #fff5d6; }

.donut-wrap { display: flex; align-items: center; justify-content: center; gap: 26px; padding: 11px 0; }
.donut { position: relative; width: 126px; height: 126px; border-radius: 50%; background: conic-gradient(var(--mint) 0 54%, var(--lime) 54% 78%, var(--blue) 78% 91%, #e7ebe9 91%); }
.donut::after { content: ""; position: absolute; inset: 17px; border-radius: 50%; background: white; }
.donut-center { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; text-align: center; }.donut-center strong { font-size: 22px; }.donut-center span { color: var(--faint); font-size: 8px; }
.legend-list { display: grid; gap: 11px; }.legend-row { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 8px; font-size: 9px; }.legend-row i { width: 8px; height: 8px; border-radius: 3px; }.legend-row span { color: var(--muted); }.legend-row b { font-size: 9px; }

.alert-list { display: grid; gap: 8px; }
.alert-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; }
.student-avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--avatar-bg); color: var(--avatar-color); font-size: 10px; font-weight: 700; }
.alert-row b { display: block; font-size: 10px; }.alert-row small { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; }
.risk-score { text-align: right; }.risk-score strong { display: block; color: var(--coral); font-size: 11px; }.risk-score span { color: var(--faint); font-size: 8px; }

.event-table { width: 100%; border-collapse: collapse; font-size: 10px; }
.event-table th { padding: 10px 12px; color: var(--faint); background: #f7f9f8; text-align: left; font-size: 8px; letter-spacing: .06em; }
.event-table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--muted); }
.event-table td:first-child { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
.event-table tr:last-child td { border-bottom: 0; }
.status-dot { display: inline-flex; align-items: center; gap: 5px; color: var(--mint); }.status-dot::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.table-wrap { overflow-x: auto; }

.model-flow { display: flex; align-items: center; justify-content: center; gap: 8px; overflow-x: auto; margin-bottom: 17px; padding: 13px 16px; border: 1px solid #dce9e4; border-radius: 12px; background: linear-gradient(90deg,#f0f7f4,#f7faf8); white-space: nowrap; }
.model-flow span { padding: 7px 10px; border-radius: 7px; color: var(--mint-deep); background: white; box-shadow: 0 2px 8px rgba(27,55,47,.06); font-size: 9px; font-weight: 600; }
.model-flow i { color: #8ba39d; font-size: 8px; font-style: normal; }
.model-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 13px; }
.model-card { display: flex; flex-direction: column; min-height: 236px; padding: 17px; border: 1px solid var(--line); border-radius: 15px; background: white; box-shadow: var(--shadow); }
.model-card header { display: flex; align-items: flex-start; gap: 10px; }
.model-card header > span { flex: none; width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; color: var(--mint); background: var(--mint-pale); font-size: 9px; font-weight: 700; }
.model-card h3 { margin: 0 0 3px; font-size: 12px; }
.model-card code { color: var(--mint); font-size: 8px; }
.model-card > p { margin: 13px 0 10px; color: var(--muted); font-size: 9px; }
.field-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
.field-list span { overflow: hidden; padding: 6px 7px; border-radius: 6px; color: #65766f; background: #f5f8f6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 7.5px; text-overflow: ellipsis; white-space: nowrap; }
.model-card footer { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 11px; color: var(--faint); font-size: 8px; }
.model-card footer i { width: 15px; height: 2px; border-radius: 2px; background: var(--mint); }

/* 课时归因与用户连续追踪 */

.lesson-detail-table { width: 100%; min-width: 1160px; border-collapse: collapse; font-size: 8px; }.lesson-detail-table th { padding: 9px 6px; color: var(--faint); background: #f5f8f6; text-align: left; white-space: nowrap; }.lesson-detail-table td { height: 55px; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--muted); vertical-align: middle; }.lesson-detail-table tr:last-child td { border-bottom: 0; }.lesson-detail-table td:first-child { min-width: 132px; }.lesson-detail-table td:first-child span,.lesson-detail-table td:first-child b { display: block; }.lesson-detail-table td:first-child span { margin-bottom: 3px; color: var(--mint); font-size: 7px; }.lesson-detail-table td:first-child b { color: var(--ink); font-size: 8px; }.lesson-detail-table .study-time { min-width: 108px; font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }.lesson-detail-table .jump-node { color: var(--coral); font-weight: 600; }.lesson-detail-table .blank-cell { background: repeating-linear-gradient(-45deg,#fbfcfb,#fbfcfb 4px,#f7f9f8 4px,#f7f9f8 8px); }.lesson-detail-table .unattended-row td { color: var(--faint); }
.lesson-row-title { display: flex; align-items: center; gap: 7px; }.lesson-row-title > button,.session-toggle-placeholder { flex: none; width: 25px; height: 25px; display: grid; place-items: center; border-radius: 7px; }.lesson-row-title > button { border: 1px solid #bdd8ce; color: var(--mint); background: white; cursor: pointer; font-size: 13px; font-weight: 700; }.lesson-row-title > button:hover { color: white; background: var(--mint); }.session-toggle-placeholder { background: transparent; }.lesson-row-title > div { min-width: 0; }.lesson-row-title em { display: block; margin-top: 3px; color: var(--mint); font-size: 6px; font-style: normal; }.lesson-detail-table tr.is-session-open > td { border-bottom-color: #c5ddd4; background: #f6fbf9; }
.detail-status { display: inline-flex; padding: 4px 6px; border-radius: 5px; font-size: 7px; font-weight: 700; white-space: nowrap; }.detail-status.done { color: var(--mint-deep); background: var(--mint-pale); }.detail-status.unfinished { color: #b6503d; background: var(--coral-pale); }.detail-status.blank { color: #98a5a0; background: #eef2f0; }
.question-detail { position: relative; min-width: 78px; padding: 6px; border: 1px solid #e7ece9; border-radius: 7px; background: white; }.question-detail.has-anomaly { padding-bottom: 22px; }.question-detail b,.question-detail small { display: block; white-space: nowrap; }.question-detail b { color: var(--ink); font-size: 7px; }.question-detail small { margin-top: 3px; font-size: 6.5px; }.question-detail small.correct { color: var(--mint); }.question-detail small.wrong { color: var(--coral); }.question-detail em { position: absolute; left: 5px; bottom: 5px; padding: 2px 4px; border-radius: 4px; font-size: 6px; font-style: normal; font-weight: 700; }.question-detail em.instant { color: #7662a4; background: #f2eff8; }.question-detail em.repeat { color: #9a7319; background: #fff5d6; }.question-detail em.slow { color: #b6503d; background: var(--coral-pale); }

.drawer-layer { position: fixed; inset: 0; z-index: 100; visibility: hidden; pointer-events: none; }.drawer-layer.open { visibility: visible; pointer-events: auto; }.drawer-backdrop { position: absolute; inset: 0; width: 100%; border: 0; background: rgba(10,31,27,.28); opacity: 0; transition: opacity .25s; }.drawer-layer.open .drawer-backdrop { opacity: 1; }.detail-drawer { position: absolute; top: 0; right: 0; width: min(480px,92vw); height: 100%; overflow-y: auto; padding: 34px 30px; background: white; box-shadow: -20px 0 50px rgba(19,46,40,.16); transform: translateX(100%); transition: transform .28s ease; }.drawer-layer.open .detail-drawer { transform: none; }.drawer-close { position: absolute; top: 17px; right: 18px; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--muted); cursor: pointer; font-size: 18px; }

.question-bars { display: grid; gap: 9px; }.question-bars > div { display: grid; grid-template-columns: 48px 1fr 28px; align-items: center; gap: 8px; }.question-bars span,.question-bars b { font-size: 8px; }.question-bars b { text-align: right; }.question-bars i { height: 7px; overflow: hidden; border-radius: 6px; background: #edf1ef; }.question-bars em { display: block; height: 100%; border-radius: inherit; background: var(--mint); }.question-bars em.slow { background: var(--coral); }.root-cause { padding: 13px; border-radius: 10px; background: #f8faf9; }.root-cause span { color: var(--coral); font-size: 8px; font-weight: 700; }.root-cause p,.action-box p { margin: 6px 0 0; color: var(--muted); font-size: 9px; line-height: 1.65; }.action-box { margin-top: 14px; padding: 14px; border-left: 3px solid var(--mint); border-radius: 0 10px 10px 0; background: var(--mint-pale); }.action-box b { color: var(--mint-deep); font-size: 9px; }.student-drawer-head { display: flex; align-items: center; gap: 11px; }.student-drawer-head > span { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--mint); background: var(--mint-pale); font-size: 13px; font-weight: 700; }.student-drawer-head p { margin: 4px 0 0; color: var(--faint); font-size: 8px; }.lesson-focus { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; margin-top: 18px; padding: 13px; border: 1px solid var(--line); border-radius: 10px; }.lesson-focus small { grid-column: 1/-1; color: var(--faint); font-size: 7px; }.lesson-focus b { font-size: 10px; }.empty-state { padding: 30px; border-radius: 10px; background: #f6f8f7; color: var(--faint); text-align: center; font-size: 9px; }

.parent-voice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }.parent-voice-card { --voice:#8772bb; --voice-pale:#f2eff8; overflow: hidden; border: 1px solid var(--line); border-top: 3px solid var(--voice); border-radius: 12px; background: #fff; }.parent-voice-card.is-refund { --voice:#c65e49; --voice-pale:#fff0ed; }.parent-voice-card.is-not-renewed { --voice:#8772bb; --voice-pale:#f2eff8; }.parent-voice-card.is-renewed { --voice:#1b8c72; --voice-pale:#e8f4ef; }
.parent-voice-grid.voice-count-2 { grid-template-columns: repeat(2,1fr); }.parent-voice-grid.voice-count-1 { grid-template-columns: 1fr; }.voice-count-1 .parent-voice-card { display: grid; grid-template-columns: 1.05fr .9fr 1fr; }.voice-count-1 .parent-voice-card > header { grid-column: 1 / -1; }.voice-count-1 .parent-voice-card blockquote { grid-column: 1; grid-row: 2; min-height: 0; }.voice-count-1 .voice-source { grid-column: 1; grid-row: 3; }.voice-count-1 .voice-topics { grid-column: 2; grid-row: 2; border-left: 1px dashed var(--line); }.voice-count-1 .voice-behavior { grid-column: 2; grid-row: 3; border-left: 1px dashed var(--line); }.voice-count-1 .parent-voice-card > footer { grid-column: 3; grid-row: 2 / 4; border-top: 0; border-left: 1px solid var(--line); }
.parent-voice-card > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 11px 12px; background: var(--voice-pale); }.parent-voice-card > header span,.parent-voice-card > header b { display: block; }.parent-voice-card > header span { color: var(--voice); font-size: 10px; font-weight: 700; }.parent-voice-card > header b { margin-top: 3px; color: var(--muted); font-size: 7px; }.parent-voice-card > header em { flex: none; padding: 3px 6px; border-radius: 5px; color: var(--voice); background: white; font-size: 7px; font-style: normal; font-weight: 600; }
.parent-voice-card blockquote { position: relative; min-height: 86px; margin: 0; padding: 14px 14px 10px; color: var(--ink); font-size: 10px; font-weight: 500; line-height: 1.75; }.parent-voice-card blockquote::before { content: "“"; margin-right: 3px; color: var(--voice); font-size: 20px; line-height: 0; vertical-align: -5px; }
.voice-source { display: flex; align-items: center; gap: 6px; padding: 0 14px 11px; color: var(--faint); font-size: 7px; }.voice-source i { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; color: white; background: #45b879; font-size: 7px; font-style: normal; font-weight: 700; }
.voice-topics,.voice-behavior { padding: 10px 12px; border-top: 1px dashed var(--line); }.voice-topics small,.voice-behavior small,.parent-voice-card > footer > small { display: block; margin-bottom: 7px; color: var(--faint); font-size: 7px; }.voice-topics span { display: inline-block; margin: 0 4px 4px 0; padding: 3px 6px; border-radius: 5px; color: var(--voice); background: var(--voice-pale); font-size: 7px; font-weight: 600; }
.voice-behavior > div { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }.voice-behavior span { padding: 6px; border-radius: 6px; color: var(--muted); background: #f6f8f7; font-size: 7px; }
.parent-voice-card > footer { padding: 11px 12px 12px; border-top: 1px solid var(--line); background: #fbfcfb; }.parent-voice-card > footer > b { display: block; min-height: 38px; color: var(--ink); font-size: 8px; line-height: 1.6; }.parent-voice-card > footer p { margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 7px; line-height: 1.55; }.parent-voice-card > footer p em { margin-right: 5px; color: var(--voice); font-style: normal; font-weight: 700; }

/* 用户补充画像 */
.user-profile-strip { display: grid; grid-template-columns: repeat(5,1fr); gap: 7px; margin: 0 15px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: #f8faf9; }.user-profile-strip span { min-width: 0; padding-right: 7px; border-right: 1px solid var(--line); }.user-profile-strip span:last-child { border-right: 0; }.user-profile-strip small,.user-profile-strip b { display: block; }.user-profile-strip small { color: var(--faint); font-size: 7px; }.user-profile-strip b { overflow: hidden; margin-top: 4px; color: var(--ink); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }.user-profile-strip.compact { grid-template-columns: repeat(2,1fr); margin: 14px 0 0; }.user-profile-strip.compact span { border-right: 0; }

/* 分析框架导图 */
.framework-entry { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 0 0 22px; padding: 14px 17px; border: 1px solid #cfe3dc; border-radius: 13px; color: var(--ink); background: linear-gradient(105deg,#edf8f3,#f8fbf8 72%); text-align: left; cursor: pointer; box-shadow: 0 7px 20px rgba(27,55,47,.05); }
.framework-entry > span { display: grid; grid-template-columns: auto auto; align-items: center; gap: 3px 10px; }.framework-entry i { grid-row: 1 / 3; padding: 7px 9px; border-radius: 7px; color: white; background: var(--mint); font-size: 9px; font-style: normal; }.framework-entry b { font-size: 12px; }.framework-entry small { color: var(--muted); font-size: 9px; }.framework-entry > em { flex: none; display: flex; align-items: center; gap: 7px; color: var(--mint); font-size: 10px; font-style: normal; font-weight: 600; }.framework-entry svg { width: 15px; }
.framework-principles { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 18px; }.framework-principles article { padding: 16px 17px; border: 1px solid var(--line); border-radius: 13px; background: white; box-shadow: var(--shadow); }.framework-principles span { display: block; color: var(--mint); font-size: 8px; font-weight: 700; letter-spacing: .12em; }.framework-principles b { display: block; margin-top: 7px; font-size: 13px; }.framework-principles p { margin: 6px 0 0; color: var(--muted); font-size: 9px; line-height: 1.65; }
.framework-canvas { padding: 24px; background: linear-gradient(150deg,#fff 0%,#f6faf8 100%); }.framework-canvas-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 20px; }.framework-canvas-head span { color: var(--mint); font-size: 8px; font-weight: 700; letter-spacing: .16em; }.framework-canvas-head h3 { margin: 5px 0; font-size: 17px; }.framework-canvas-head p { margin: 0; color: var(--muted); font-size: 10px; }.framework-canvas-head > em { padding: 7px 10px; border-radius: 7px; color: var(--mint-deep); background: var(--mint-pale); font-size: 9px; font-style: normal; }
.framework-map { display: grid; grid-template-columns: repeat(5,minmax(205px,1fr)); gap: 14px; overflow-x: auto; padding: 3px 3px 11px; }.framework-layer { --layer:#1b8c72; --layer-pale:#e8f4ef; position: relative; min-height: 286px; padding: 16px; border: 1px solid color-mix(in srgb,var(--layer) 28%,white); border-radius: 13px; background: white; }.framework-layer.is-data { --layer:#5b7fc9; --layer-pale:#edf2fb; }.framework-layer.is-diagnose { --layer:#8772bb; --layer-pale:#f2eff8; }.framework-layer.is-attribute { --layer:#c65e49; --layer-pale:#fff0ed; }.framework-layer.is-action { --layer:#b48825; --layer-pale:#fff7de; }.framework-layer > header { display: flex; align-items: flex-start; gap: 10px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }.framework-layer > header i { flex: none; width: 31px; height: 31px; display: grid; place-items: center; border-radius: 9px; color: var(--layer); background: var(--layer-pale); font-size: 9px; font-style: normal; font-weight: 700; }.framework-layer > header b,.framework-layer > header small { display: block; }.framework-layer > header b { font-size: 12px; }.framework-layer > header small { margin-top: 4px; color: var(--muted); font-size: 8px; line-height: 1.45; }.framework-layer > div { display: grid; gap: 7px; margin-top: 13px; }.framework-layer > div span { position: relative; padding: 8px 9px 8px 19px; border-radius: 7px; color: #3c554f; background: var(--layer-pale); font-size: 9px; line-height: 1.45; }.framework-layer > div span::before { content:""; position: absolute; left: 9px; top: 12px; width: 4px; height: 4px; border-radius: 50%; background: var(--layer); }.framework-arrow { position: absolute; right: -23px; top: 48%; z-index: 2; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--mint); background: white; box-shadow: 0 4px 10px rgba(27,55,47,.08); font-size: 14px; font-style: normal; }
.framework-loop { display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; gap: 10px; margin-top: 8px; padding: 11px 14px; border: 1px dashed #b8d5cc; border-radius: 10px; color: var(--mint-deep); background: rgba(232,244,239,.62); font-size: 9px; }.framework-loop span { padding: 5px 8px; border-radius: 6px; color: white; background: var(--mint); font-weight: 600; }.framework-loop i { height: 1px; background: repeating-linear-gradient(90deg,#8db8ab 0 4px,transparent 4px 8px); }.framework-loop b { font-weight: 500; text-align: center; }
.framework-use-head { margin: 25px 0 13px; }.framework-use-head span { color: var(--mint); font-size: 8px; font-weight: 700; letter-spacing: .12em; }.framework-use-head h3 { margin: 6px 0 0; font-size: 15px; }.framework-use-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 13px; }.framework-use-grid button { padding: 18px; border: 1px solid var(--line); border-radius: 13px; color: var(--ink); background: white; text-align: left; cursor: pointer; box-shadow: var(--shadow); transition: .2s; }.framework-use-grid button:hover { transform: translateY(-2px); border-color: #9bc7ba; }.framework-use-grid i,.framework-use-grid b,.framework-use-grid p,.framework-use-grid span { display: block; }.framework-use-grid i { color: var(--mint); font-size: 8px; font-style: normal; font-weight: 700; }.framework-use-grid b { margin-top: 7px; font-size: 13px; }.framework-use-grid p { min-height: 45px; margin: 7px 0 12px; color: var(--muted); font-size: 9px; line-height: 1.6; }.framework-use-grid span { padding-top: 10px; border-top: 1px solid var(--line); color: var(--mint); font-size: 9px; font-weight: 600; }.framework-boundary { display: flex; align-items: flex-start; gap: 11px; margin-top: 14px; padding: 13px 15px; border-radius: 10px; color: #725f31; background: #fff8e6; font-size: 9px; line-height: 1.6; }.framework-boundary b { flex: none; }

.toast { position: fixed; right: 28px; bottom: 28px; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 12px 17px; border-radius: 11px; color: white; background: #173b34; box-shadow: 0 12px 30px rgba(17,47,43,.25); transform: translateY(80px); opacity: 0; pointer-events: none; transition: .3s ease; }
.toast.show { transform: none; opacity: 1; }.toast span { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; color: #14352f; background: var(--lime); font-size: 11px; }.toast p { margin: 0; font-size: 11px; }
.scrim { display: none; }
/* fill-mode 用 backwards 而不是 both：both 会让动画结束后仍保留 transform 的
   计算值 matrix(1,0,0,1,0,0)，虽是单位矩阵但不等于 none，会使 .fade-in 成为
   position: fixed 的包含块，导致内部的下钻抽屉贴着 section 定位而跑出视口。
   本动画无 delay，backwards 与 both 视觉上完全一致。 */
.fade-in { animation: fadeIn .35s ease backwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

@media (max-width: 1050px) {
  .app-shell { grid-template-columns: 200px minmax(0, 1fr); }.sidebar { width: 200px; }.scheme-grid { grid-template-columns: 1fr; }.scheme-card { min-height: 145px; }.kpi-grid { grid-template-columns: repeat(2, 1fr); }.dashboard-grid { grid-template-columns: 1fr; }.panel-wide { grid-column: auto; }.parent-voice-grid { grid-template-columns: 1fr; }.voice-count-1 .parent-voice-card { display: block; }.voice-count-1 .voice-topics,.voice-count-1 .voice-behavior,.voice-count-1 .parent-voice-card > footer { border-left: 0; }.parent-voice-card blockquote,.parent-voice-card > footer > b { min-height: 0; }.framework-principles { grid-template-columns: repeat(2,1fr); }
}

  .top-actions { max-width: 720px; }
}
@media (max-width: 760px) {
  .app-shell { display: block; }.main { grid-column: auto; }.sidebar { width: 232px; transform: translateX(-100%); transition: transform .25s ease; }.sidebar.open { transform: none; }.scrim { position: fixed; inset: 0; z-index: 15; background: rgba(9,29,25,.35); backdrop-filter: blur(2px); }.scrim.show { display: block; }
  .topbar { height: auto; min-height: 90px; padding: 16px 18px; align-items: flex-start; }.topbar > div:first-child { display: grid; grid-template-columns: 36px 1fr; column-gap: 10px; }.mobile-menu { display: grid; width: 36px; height: 36px; grid-row: 1 / 3; }.eyebrow { grid-column: 2; }.topbar h1 { grid-column: 2; font-size: 18px; }.top-actions { align-self: center; }.select-wrap span, .top-actions .select-wrap { display: none; }.select-wrap { padding: 0 7px; height: 36px; }.select-wrap select { max-width: 100px; font-size: 10px; }.icon-button { width: 36px; height: 36px; }
  .content { padding: 24px 17px 40px; }.intro-row { align-items: flex-start; flex-direction: column; gap: 12px; }.scheme-grid, .kpi-grid, .stage-grid { grid-template-columns: 1fr; }.funnel { overflow-x: auto; }.funnel-step { min-width: 120px; }.flow-track { overflow-x: auto; grid-template-columns: repeat(5, 105px); }.event-table { min-width: 640px; }.donut-wrap { flex-direction: column; }.section-head { gap: 14px; align-items: flex-start; }.goal-pill { display: none; }.model-flow { justify-content: flex-start; }.model-grid { display: block; }.model-card { margin-bottom: 11px; }.field-list { grid-template-columns: 1fr; }.analysis-toolbar { align-items: flex-start; flex-direction: column; }.analysis-toolbar label { width: 100%; }.analysis-toolbar .cohort-range { padding-left: 0; border: 0; }.month-plan { justify-content: flex-start; overflow-x: auto; }.segment-tabs { grid-template-columns: repeat(2,1fr); }.compare-grid { grid-template-columns: 1fr; }.status-legend { display: none; }.drawer-metrics,.drawer-metrics.six { grid-template-columns: repeat(2,1fr); }.user-detail-heading { grid-template-columns: auto 40px 1fr; }.user-detail-summary { grid-column: 1/-1; }.student-name-button em { opacity: 1; }.monitor-flow-head { align-items: flex-start; flex-direction: column; }.monitor-flow-grid { grid-template-columns: 1fr; }.monitor-flow-card > em { display: none; }.inline-session-replay > header { align-items: flex-start; flex-direction: column; }.session-replay-stats { flex-wrap: wrap; }.inline-session-replay > footer { grid-template-columns: 1fr; }.inline-session-replay footer > i { transform: rotate(90deg); }.voice-process { justify-content: flex-start; overflow-x: auto; }.voice-process span { flex: none; }.user-profile-strip { grid-template-columns: repeat(2,1fr); }.user-profile-strip span { border-right: 0; }.framework-entry small { display: none; }.framework-principles,.framework-use-grid { grid-template-columns: 1fr; }.framework-canvas { padding: 16px; }.framework-canvas-head { align-items: flex-start; flex-direction: column; }.framework-loop { grid-template-columns: auto 1fr auto; }.framework-loop i:nth-of-type(2),.framework-loop span:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ============================================================
   连续行为监测组件样式
   与 styles.css 共用同一套设计变量，独立成文件便于并行维护。
   build-standalone.mjs 会把本文件与 styles.css 一起内联进 index.html。
   ============================================================ */

.panel-full { grid-column: 1 / -1; }

/* ---------- 结果决策首页 ---------- */
.decision-page { display: grid; gap: 18px; }
.decision-intro { align-items: center; margin-bottom: 0; padding: 2px 0 4px; }
.decision-intro h2 { max-width: 720px; font-size: 26px; letter-spacing: -.04em; }
.decision-intro p:not(.decision-kicker) { max-width: 820px; }
.decision-kicker { margin-bottom: 8px !important; color: var(--mint) !important; font-size: 9px !important; font-weight: 700; letter-spacing: .17em; }

.outcome-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.outcome-card { min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: 15px; color: var(--ink); background: white; box-shadow: var(--shadow); cursor: pointer; text-align: left; transition: .2s ease; }
.outcome-card:hover { border-color: var(--outcome-color); transform: translateY(-2px); }
.outcome-card.active { border-color: var(--outcome-color); background: linear-gradient(145deg, var(--outcome-pale), white 72%); box-shadow: inset 0 0 0 1px var(--outcome-color), var(--shadow); }
.outcome-top { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 8px; font-weight: 600; }
.outcome-top i { width: 6px; height: 6px; border-radius: 50%; background: var(--outcome-color); box-shadow: 0 0 0 4px var(--outcome-pale); }
.outcome-main { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
.outcome-main strong { color: var(--outcome-color); font-size: 27px; letter-spacing: -.05em; }
.outcome-main em { color: var(--muted); font-size: 9px; font-style: normal; }
.outcome-card > b { display: block; margin: 2px 0 6px; font-size: 13px; }
.outcome-card > small { display: block; min-height: 28px; color: var(--muted); font-size: 9px; line-height: 1.55; }
.outcome-question { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--outcome-color); font-size: 8px; font-weight: 600; }
.outcome-question svg { flex: none; width: 12px; height: 12px; }

.outcome-focus { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, .85fr); gap: 17px 28px; padding: 22px 24px; border: 1px solid color-mix(in srgb, var(--focus-color) 25%, #fff); border-left: 4px solid var(--focus-color); border-radius: 16px; background: linear-gradient(110deg, var(--focus-pale), white 62%); box-shadow: var(--shadow); }
.focus-copy > span { color: var(--focus-color); font-size: 8px; font-weight: 700; letter-spacing: .14em; }
.focus-copy h3 { margin: 8px 0 7px; font-size: 16px; letter-spacing: -.02em; }
.focus-copy p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.75; }
.focus-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-self: center; }
.focus-stats div { padding: 11px; border: 1px solid rgba(255,255,255,.8); border-radius: 10px; background: rgba(255,255,255,.72); }
.focus-stats small, .focus-stats b, .focus-stats em { display: block; }
.focus-stats small { color: var(--faint); font-size: 7px; }
.focus-stats b { margin-top: 5px; font-size: 12px; }
.focus-stats em { margin-top: 3px; color: var(--focus-color); font-size: 7px; font-style: normal; font-weight: 600; }
.focus-action { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-top: 13px; border-top: 1px solid color-mix(in srgb, var(--focus-color) 15%, #fff); }
.focus-action span { flex: none; padding: 4px 7px; border-radius: 5px; color: white; background: var(--focus-color); font-size: 7px; font-weight: 700; }
.focus-action p { margin: 0; color: var(--muted); font-size: 9px; }

.decision-section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-top: 11px; }
.decision-section-head span { color: var(--mint); font-size: 8px; font-weight: 700; letter-spacing: .12em; }
.decision-section-head h3 { margin: 6px 0 4px; font-size: 16px; letter-spacing: -.025em; }
.decision-section-head p { margin: 0; color: var(--muted); font-size: 9px; }
.decision-section-head button { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid #cfe1da; border-radius: 8px; color: var(--mint-deep); background: var(--mint-pale); cursor: pointer; font-size: 8px; font-weight: 600; }
.decision-section-head button svg { width: 11px; }

.refund-split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.refund-branch { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: var(--shadow); }
.refund-branch > header { display: grid; grid-template-columns: 34px 1fr auto; gap: 11px; align-items: start; padding: 17px 18px; background: #fff9f7; }
.refund-branch.high-completion > header { background: #f6f4fb; }
.branch-index { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; color: #b6503d; background: #ffe4de; font-size: 10px; font-weight: 700; }
.high-completion .branch-index { color: #71609c; background: #e9e4f4; }
.refund-branch header small { color: var(--faint); font-size: 8px; }
.refund-branch header h3 { margin: 4px 0 3px; font-size: 13px; }
.refund-branch header p { margin: 0; color: var(--muted); font-size: 8px; line-height: 1.55; }
.refund-branch header > strong { padding: 7px 9px; border-radius: 8px; color: #b6503d; background: #ffe9e4; font-size: 8px; line-height: 1.45; text-align: center; }
.high-completion header > strong { color: #71609c; background: #e9e4f4; }
.reason-list { display: grid; padding: 5px 18px 12px; }
.decision-reason { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 12px 0; }
.decision-reason + .decision-reason { border-top: 1px dashed var(--line); }
.reason-dot { width: 7px; height: 7px; margin-top: 4px; border: 2px solid white; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 1px var(--coral); }
.high-completion .reason-dot { background: var(--violet); box-shadow: 0 0 0 1px var(--violet); }
.decision-reason h4 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 7px; font-size: 10px; }
.decision-reason h4 em { padding: 3px 5px; border-radius: 4px; color: #b6503d; background: var(--coral-pale); font-size: 7px; font-style: normal; }
.high-completion .decision-reason h4 em { color: #71609c; background: #f2eff8; }
.decision-reason p { display: grid; grid-template-columns: 48px 1fr; gap: 6px; margin: 3px 0 0; color: var(--muted); font-size: 8px; line-height: 1.55; }
.decision-reason p span { color: var(--faint); }

.renewal-compare { display: grid; grid-template-columns: minmax(0, 1fr) 52px minmax(0, 1fr); align-items: stretch; gap: 8px; }
.renewal-card { padding: 19px; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: var(--shadow); }
.renewed-card { border-top: 3px solid var(--mint); }
.not-renewed-card { border-top: 3px solid var(--violet); }
.renewal-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 8px; font-weight: 700; letter-spacing: .06em; }
.renewal-label i { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); }
.not-renewed-card .renewal-label i { background: var(--violet); }
.renewal-card h3 { margin: 12px 0 6px; font-size: 14px; }
.renewal-card p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.7; }
.evidence-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.evidence-chips span { padding: 4px 7px; border-radius: 20px; color: var(--mint-deep); background: var(--mint-pale); font-size: 7px; font-weight: 600; }
.not-renewed-card .evidence-chips span { color: #71609c; background: #f2eff8; }
.renewal-card footer { display: flex; align-items: center; gap: 8px; margin-top: 15px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 8px; }
.renewal-card footer b { color: var(--mint); }
.not-renewed-card footer b { color: var(--violet); }
.renewal-card footer span { color: var(--muted); }
.versus-mark { display: grid; place-content: center; text-align: center; }
.versus-mark span { width: 34px; height: 34px; display: grid; place-items: center; margin: auto; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); background: white; font-size: 8px; font-weight: 700; }
.versus-mark small { margin-top: 6px; color: var(--faint); font-size: 7px; }

.priority-panel { margin-top: 2px; }
.priority-list { display: grid; }
.priority-row { display: grid; grid-template-columns: 44px .85fr .85fr 1.7fr 1fr; gap: 12px; align-items: center; padding: 12px 2px; }
.priority-row + .priority-row { border-top: 1px dashed var(--line); }
.priority-level { justify-self: start; min-width: 35px; padding: 5px 7px; border-radius: 6px; color: white; background: var(--priority-color); font-size: 8px; font-weight: 700; text-align: center; }
.priority-row small, .priority-row b { display: block; }
.priority-row small { margin-bottom: 4px; color: var(--faint); font-size: 7px; }
.priority-row b { font-size: 9px; line-height: 1.5; }
.priority-action b { color: var(--muted); font-weight: 500; }
.behavior-entry { margin-top: 4px; }
.compact-schemes { margin-bottom: 0; }
.compact-schemes .scheme-card { min-height: 166px; }

/* ---------- 2. 告警态面板标签 ---------- */
.panel-tag.alert-tag { background: var(--coral-pale); color: #c65e49; }

/* ---------- 3. 能力对比表（.event-table 的修饰） ---------- */
.compare-table td:first-child { width: 17%; font-family: inherit; font-weight: 600; }
.compare-table th:nth-child(2), .compare-table td:nth-child(2) { width: 33%; }
.compare-table td:nth-child(2) { color: var(--faint); }
.compare-table th:nth-child(3) { border-left: 2px solid var(--mint-pale); color: var(--mint-deep); background: #f2f9f6; }
.compare-table td:nth-child(3) { border-left: 2px solid var(--mint-pale); background: #f8fcfa; color: var(--ink); }

/* ---------- 4. 断点分布 ---------- */
.break-groups { display: grid; gap: 16px; }
.break-group > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.break-group > header b { font-size: 11px; }
.break-group > header span { color: var(--bg-color); font-size: 11px; font-weight: 700; letter-spacing: -.02em; }
.break-track { display: flex; height: 10px; border-radius: 6px; background: #eef1ef; overflow: hidden; }
.break-track i { flex: 0 0 auto; height: 100%; cursor: default; background: var(--line); background: color-mix(in srgb, var(--bg-color) 22%, #fff); transition: background .2s ease; }
.break-track i + i { box-shadow: inset 1px 0 0 #fff; }
.break-track i.hot { background: var(--bg-color); }
.break-ticks { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 3px 8px; margin-top: 7px; color: var(--faint); font-size: 8px; }
.break-ticks span { white-space: nowrap; }
.break-ticks span.hot { color: var(--bg-color); font-weight: 700; }
.break-group > small { display: block; margin-top: 7px; color: var(--faint); font-size: 9px; }

/* ---------- 5. 会话时间轴 ---------- */
.timeline { display: grid; gap: 2px; }
.tl-row { display: grid; grid-template-columns: 40px 10px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 7px 9px; border-left: 2px solid transparent; border-radius: 8px; }
.tl-time { color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; }
.tl-dot { position: relative; align-self: stretch; width: 10px; }
.tl-dot::before { content: ""; position: absolute; left: 50%; top: -8px; bottom: -8px; width: 1px; margin-left: -.5px; background: var(--line); }
.tl-dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: #cbd6d2; transform: translate(-50%, -50%); }
.tl-row:first-child .tl-dot::before { top: 50%; }
.tl-row:last-child .tl-dot::before { bottom: 50%; }
.tl-body b { display: block; font-size: 10px; line-height: 1.4; }
.tl-body small { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; }
.tl-flag { justify-self: end; padding: 3px 7px; border-radius: 5px; font-size: 8px; font-weight: 600; white-space: nowrap; }
.tl-row.is-warn { background: #fffdf5; }
.tl-row.is-warn .tl-dot::after { background: var(--yellow); }
.tl-row.is-danger { background: var(--coral-pale); }
.tl-row.is-danger .tl-dot::after { background: var(--coral); }
.tl-row.is-break { border-left-color: #c65e49; background: var(--coral-pale); }
.tl-row.is-break .tl-dot::after { width: 13px; height: 13px; background: #c65e49; box-shadow: 0 0 0 4px rgba(198, 94, 73, .16); }
.tl-row.is-break .tl-body b { color: #a34a37; font-weight: 700; }
.tl-flag.warn { color: #997317; background: #fff5d6; }
.tl-flag.danger { color: #b6503d; background: #ffe3dc; }
.tl-flag.break { color: white; background: #c65e49; }

/* ---------- 6. 信号提升度 ---------- */
.lift-list { display: grid; }
.lift-row { display: grid; grid-template-columns: 1.1fr 1.6fr 46px 44px; align-items: center; gap: 11px; padding: 10px 0; }
.lift-row + .lift-row { border-top: 1px dashed var(--line); }
.lift-name b { display: block; font-size: 10px; }
.lift-name small { display: block; margin-top: 3px; color: var(--faint); font-size: 8px; line-height: 1.5; }
.lift-name em { display: inline-block; margin-right: 5px; padding: 1px 4px; border-radius: 4px; color: var(--mint); background: var(--mint-pale); font-style: normal; font-size: 7px; font-weight: 700; }
.lift-bars { display: grid; gap: 3px; }
.lift-bar { display: grid; grid-template-columns: minmax(0, 1fr) 30px; align-items: center; column-gap: 7px; }
.lift-bar::before { content: ""; grid-area: 1 / 1; height: 6px; border-radius: 4px; background: #eef1ef; }
.lift-bar i { grid-area: 1 / 1; min-width: 3px; height: 6px; border-radius: 4px; background: var(--emo); transform-origin: left; animation: grow .8s ease both; }
.lift-bar span { grid-area: 1 / 2; color: var(--muted); font-size: 8px; text-align: right; }
.lift-bar.base i { background: #d8dedb; }
.lift-bar.base span { color: var(--faint); }
.lift-badge { display: grid; place-items: center; height: 27px; border: 1px solid var(--line); border-radius: 7px; background: #fbfcfb; background: linear-gradient(to top, color-mix(in srgb, var(--emo) 20%, #fff) var(--fill, 0%), #fbfcfb var(--fill, 0%)); font-size: 10px; font-weight: 700; letter-spacing: -.02em; }
.emo-tag { display: inline-flex; align-items: center; justify-content: center; padding: 4px 6px; border-radius: 20px; color: var(--emo); background: #f3f5f4; background: color-mix(in srgb, var(--emo) 12%, #fff); font-size: 8px; font-weight: 600; white-space: nowrap; }

/* ---------- 7. 回放条 ---------- */
.replay-strip { display: flex; gap: 11px; overflow-x: auto; padding: 2px 2px 8px; }
.rp-step { position: relative; flex: 0 0 auto; min-width: 62px; max-width: 92px; padding: 8px 7px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfb; text-align: center; }
.rp-step + .rp-step::before { content: "›"; position: absolute; left: -7px; top: 50%; color: #c3cdc8; font-size: 10px; transform: translateY(-50%); }
.rp-step b { display: block; color: var(--faint); font-size: 9px; font-weight: 700; }
.rp-step span { display: block; margin: 4px 0 3px; overflow: hidden; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.rp-step small { display: block; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; }
.rp-step.is-warn { border-color: #f0e2b7; background: #fffdf5; }
.rp-step.is-warn b { color: #997317; }
.rp-step.is-danger { border-color: #f7cfc4; background: var(--coral-pale); }
.rp-step.is-danger b { color: #b6503d; }
.rp-step.is-break { border-color: #c65e49; background: #c65e49; }
.rp-step.is-break b, .rp-step.is-break span { color: white; }
.rp-step.is-break small { color: rgba(255, 255, 255, .72); }
.rp-note { display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 9px 12px; border-radius: 9px; background: #f8faf8; color: var(--muted); font-size: 9px; line-height: 1.6; }
.rp-note b { color: var(--ink); }

/* ---------- 8. 信号组合链 ---------- */
.chain-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chain-item { padding: 13px 15px; border: 1px solid var(--line); border-left: 3px solid var(--emo); border-radius: 13px; background: #fbfcfb; }
.chain-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; }
.chain-flow span { padding: 4px 7px; border-radius: 6px; color: var(--ink); background: #eff2f0; font-size: 9px; }
.chain-flow i { color: var(--faint); font-size: 8px; font-style: normal; }
.chain-flow b { color: #c65e49; font-size: 9px; font-weight: 700; }
.chain-meta { display: flex; align-items: center; gap: 20px; margin-top: 12px; }
.chain-meta div strong { display: block; font-size: 13px; letter-spacing: -.03em; }
.chain-meta div small { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; }
.chain-meta .chain-prob { color: var(--coral); }
.chain-meta .emo-tag { margin-left: auto; }
.chain-note { margin: 9px 0 0; color: var(--faint); font-size: 9px; font-style: italic; line-height: 1.6; }

/* ---------- 9. 公式块 ---------- */
.formula-box { padding: 16px; border: 1px solid #dce9e4; border-radius: 12px; background: linear-gradient(180deg, #f1f8f5, #fbfcfb); }
.formula-line { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 10px; margin-bottom: 8px; }
.f-label { display: grid; place-items: center; padding: 5px 0; border-radius: 6px; color: var(--mint-deep); background: var(--mint-pale); font-size: 8px; font-weight: 600; }
.formula-line code { overflow-x: auto; padding: 8px 11px; border-radius: 7px; color: var(--ink); background: white; box-shadow: 0 2px 8px rgba(27, 55, 47, .04); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: nowrap; }
.formula-box sub, .formula-box sup { position: relative; font-size: 7px; line-height: 0; vertical-align: baseline; }
.formula-box sup { top: -.45em; }
.formula-box sub { bottom: -.2em; }
.formula-note { margin: 12px 0 0; color: var(--muted); font-size: 9px; line-height: 1.7; }

/* ---------- 10. 指数刻度条 ---------- */
.grade-scale { display: flex; gap: 3px; margin-top: 14px; }
.gs-seg { min-width: 0; }
.gs-seg::before { content: ""; display: block; height: 6px; margin-bottom: 7px; border-radius: 3px; background: var(--c); }
.gs-seg b { display: block; font-size: 9px; }
.gs-seg span { display: block; margin-top: 2px; color: var(--faint); font-size: 8px; }

/* ---------- 11. 情绪对比（复用 .stage-card 观感） ---------- */
.emo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
.emo-card { padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: #fbfcfb; }
.stage-metric.is-caveat { align-items: flex-start; gap: 9px; margin-top: 6px; padding: 8px 9px; border-top: 0; border-left: 2px solid var(--yellow); border-radius: 0 7px 7px 0; background: #fffdf5; color: var(--faint); font-size: 8px; font-style: italic; line-height: 1.55; }
.stage-metric.is-caveat span { flex: none; }
.stage-metric.is-caveat strong { color: var(--faint); font-size: 8px; font-weight: 600; font-style: italic; text-align: right; }

/* ---------- 12. 三重验证卡 ---------- */
.valid-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
.valid-card { position: relative; overflow: hidden; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: #fbfcfb; }
.valid-card::after { content: ""; position: absolute; right: -30px; top: -34px; width: 98px; height: 98px; border-radius: 50%; background: #f1f4f2; background: color-mix(in srgb, var(--vc) 10%, #fff); }
.valid-card > * { position: relative; z-index: 1; }
.valid-card span { display: block; color: var(--faint); font-size: 9px; }
.valid-card strong { display: block; margin: 8px 0 9px; color: var(--vc); font-size: 24px; letter-spacing: -.04em; }
.valid-card p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.7; }

/* ---------- 13. 落地节奏 ---------- */
.phase-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
.phase-card { padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: #fbfcfb; }
.phase-card span { display: inline-block; padding: 4px 7px; border-radius: 6px; color: var(--mint-deep); background: var(--mint-pale); font-size: 8px; font-weight: 600; }
.phase-card b { display: block; margin: 11px 0 6px; font-size: 12px; }
.phase-card p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.75; }

/* ---------- 14. 连续性堆叠条 ---------- */
.split-block + .split-block { margin-top: 18px; }
.split-title { margin: 14px 0 9px; font-size: 10px; font-weight: 700; }
.stack-bar { display: flex; height: 12px; margin: 0 0 12px; border-radius: 7px; background: #eef1ef; overflow: hidden; }
.stack-bar i { flex: 0 0 auto; height: 100%; cursor: default; }
.stack-bar i + i { box-shadow: inset 1px 0 0 #fff; }

/* ---------- 15. 数据模型页 ---------- */
.model-grid { grid-template-columns: repeat(3, 1fr); }
.model-card.is-new { padding-left: 15px; border-left: 3px solid var(--mint); }
.model-card.is-new header > span { color: white; background: var(--mint); }
.model-flow span.is-new { color: white; background: var(--mint); box-shadow: 0 2px 8px rgba(27, 140, 114, .22); }
.status-dot.is-new { color: #997317; }
.status-dot.is-new::before { background: var(--yellow); }

/* ================= 断点 ================= */
@media (max-width: 1050px) {
  .lift-row { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.35fr) 44px 42px; gap: 9px; }
  .chain-meta { gap: 14px; }
  .valid-card strong { font-size: 21px; }
  .formula-line { grid-template-columns: 48px minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .panel-full { grid-column: auto; }
  .tl-row { grid-template-columns: 34px 10px minmax(0, 1fr); column-gap: 8px; }
  .tl-row .tl-dot { grid-row: 1 / span 2; }
  .tl-row .tl-flag { grid-column: 3; justify-self: start; margin-top: 4px; }
  .lift-row { grid-template-columns: minmax(0, 1fr) 44px 46px; column-gap: 8px; row-gap: 9px; padding: 12px 0; }
  .lift-row .lift-name { grid-area: 1 / 1; }
  .lift-row .emo-tag { grid-area: 1 / 2; }
  .lift-row .lift-badge { grid-area: 1 / 3; }
  .lift-row .lift-bars { grid-area: 2 / 1 / 3 / 4; }
  .chain-list, .emo-grid, .valid-grid, .phase-grid { grid-template-columns: 1fr; }
  .chain-meta { gap: 16px; }
  .formula-line { grid-template-columns: minmax(0, 1fr); row-gap: 6px; }
  .f-label { justify-self: start; padding: 4px 10px; }
  .valid-card strong { font-size: 22px; }
  .grade-scale { gap: 2px; }
  .compare-table th:nth-child(2), .compare-table td:nth-child(2) { width: auto; }
}

/* 断点密度条：动画播放位置 × 该时段断点次数 */
.density-chart { margin: 4px 0 2px; }
.dc-plot { height: 132px; display: flex; align-items: flex-end; gap: 3px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
.dc-plot i { flex: 1; min-width: 0; height: var(--h); border-radius: 3px 3px 0 0; background: #cfe0d9; animation: grow-y .7s ease both; transition: background .2s; }
.dc-plot i:hover { background: var(--mint); }
.dc-plot i.hot { background: var(--coral); }
.dc-plot i.hot:hover { background: #dd6a52; }
.dc-axis { display: flex; justify-content: space-between; padding-top: 7px; color: var(--faint); font-size: 8px; }
@keyframes grow-y { from { height: 0; } }

@media (max-width: 1050px) {
  .outcome-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .outcome-focus { grid-template-columns: 1fr; }
  .focus-action { grid-column: auto; }
  .refund-split { grid-template-columns: 1fr; }
  .priority-row { grid-template-columns: 42px .8fr .8fr 1.4fr; }
  .priority-row > div:last-child { grid-column: 2 / -1; }
}

@media (max-width: 760px) {
  .decision-page { width: 100%; min-width: 0; gap: 15px; overflow: hidden; }
  .decision-page > * { width: 100%; min-width: 0; max-width: 100%; }
  .decision-intro h2 { font-size: 21px; }
  .outcome-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
  .outcome-card { width: 100%; min-width: 0; overflow: hidden; padding: 13px; }
  .outcome-main strong { font-size: 22px; }
  .outcome-question { display: none; }
  .outcome-card > small { min-height: 42px; }
  .outcome-focus { padding: 18px; }
  .focus-stats { grid-template-columns: 1fr; }
  .decision-section-head { align-items: flex-start; flex-direction: column; }
  .refund-branch > header { grid-template-columns: 32px 1fr; }
  .refund-branch header > strong { grid-column: 2; justify-self: start; }
  .renewal-compare { grid-template-columns: 1fr; }
  .versus-mark { min-height: 38px; }
  .versus-mark span { width: 30px; height: 30px; }
  .versus-mark small { display: none; }
  .priority-row { grid-template-columns: 40px 1fr; align-items: start; }
  .priority-row > div, .priority-row > div:last-child { grid-column: 2; }
}

/* 表格内的强调元素 */
.event-table tr.row-alert td { background: #fff8f6; }
.event-table tr.row-alert td:first-child { box-shadow: inset 2px 0 0 var(--coral); }
.delta { display: inline-block; padding: 3px 6px; border-radius: 5px; font-size: 8px; font-weight: 600; }
.delta.good { color: #14705c; background: var(--mint-pale); }
.delta.flat { color: var(--faint); background: #f0f2f1; }
.score-pill { display: inline-grid; place-items: center; min-width: 26px; padding: 3px 6px; border-radius: 6px; color: white; background: var(--sc); font-size: 9px; font-weight: 700; }
.band-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--sc); vertical-align: middle; }

/* ---------- 课时 → 题目三级指标下钻 ---------- */
.metric-definition { display: flex; align-items: center; gap: 9px; margin: -3px 0 15px; padding: 10px 12px; border: 1px solid #dfeae6; border-radius: 10px; color: var(--muted); background: #f7faf8; font-size: 8px; }
.metric-definition span { display: inline-flex; align-items: center; gap: 5px; }
.metric-definition b { color: var(--mint-deep); }
.metric-definition i { color: #9cafaa; font-style: normal; }
.metric-definition em { margin-left: auto; color: var(--faint); font-style: normal; }
.lesson-analysis-map { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: 10px; margin: 0 0 18px; }.lesson-analysis-map > section { display: flex; align-items: center; gap: 11px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 12px; background: white; box-shadow: var(--shadow); }.lesson-analysis-map > section:nth-of-type(1) { border-top: 3px solid #1b8c72; }.lesson-analysis-map > section:nth-of-type(2) { border-top: 3px solid #5b7fc9; }.lesson-analysis-map > section:nth-of-type(3) { border-top: 3px solid #8772bb; }.lesson-analysis-map > section > i { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--mint); background: var(--mint-pale); font-size: 8px; font-style: normal; font-weight: 700; }.lesson-analysis-map span,.lesson-analysis-map b,.lesson-analysis-map small { display: block; }.lesson-analysis-map span { color: var(--mint); font-size: 8px; font-weight: 700; }.lesson-analysis-map b { margin-top: 4px; color: var(--ink); font-size: 9px; }.lesson-analysis-map small { margin-top: 3px; color: var(--faint); font-size: 7px; }.lesson-analysis-map > em { align-self: center; color: #94aaa4; font-size: 13px; font-style: normal; }
.lesson-definition { flex-wrap: wrap; }.lesson-definition em { min-width: 220px; text-align: right; }
.attribution-wrap { margin: 0 -1px; }
.attribution-table { min-width: 1120px; }
.attribution-table > tbody > .lesson-summary-row { cursor: pointer; }
.attribution-table > tbody > .lesson-summary-row.is-expanded td { border-bottom-color: #d6e7e1; background: #f1f8f5; }

.question-breakdown-row, .question-breakdown-row:hover { cursor: default !important; background: white !important; }

.question-breakdown-head button { flex: none; padding: 7px 9px; border: 1px solid #cfe2db; border-radius: 7px; color: var(--mint-deep); background: var(--mint-pale); cursor: pointer; font-size: 8px; font-weight: 600; }
.question-metric-table { min-width: 1040px; border: 1px solid var(--line); border-radius: 10px; border-collapse: separate; border-spacing: 0; overflow: hidden; background: white; }

.question-metric-table tr:last-child td { border-bottom: 0 !important; }

.question-metric-table tbody tr:hover td { background: #fafcfb; }
.question-metric-table .question-risk-row td { background: #fff9f7; }
.question-metric-table td:first-child b { color: var(--ink); font-size: 9px; }
.question-type { padding: 3px 6px; border-radius: 5px; color: var(--muted); background: #eef2f0; font-size: 7px; }
.difficulty { display: inline-block; margin-left: 4px; padding: 3px 5px; border-radius: 5px; color: #7d6a33; background: #fff5d8; font-size: 7px; }.difficulty.hard { color: #b24f3d; background: #fff0ed; }
.answer-anomaly { display: flex; gap: 4px; }.answer-anomaly span { padding: 3px 5px; border-radius: 5px; color: var(--faint); background: #f1f4f2; font-size: 7px; }.answer-anomaly span.on { color: #8b6d1e; background: #fff5d8; }.answer-anomaly span.slow { color: #b24f3d; background: #fff0ed; }
.question-value { font-weight: 700; color: var(--ink); }

.metric-inline { display: grid; grid-template-columns: 52px 36px; align-items: center; gap: 7px; }
